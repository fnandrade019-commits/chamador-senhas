<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chamador de Senhas</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>CHAMADOR DE SENHAS</h1>
      <a href="tela.html" target="_blank">Abrir tela da TV</a>
    </header>

    <main>
      <form id="form-pedido" class="cartao"> 
        <label for="input-nome">Nome do cliente</label>
        <input id="input-nome" type="text" placeholder="Ex.: Maria" />
        <button type="submit">Gerar senha</button>
      </form>

      <section class="cartao">
        <h2>Chamando agora</h2>
        <strong id="senha-atual">--</strong>
        <span id="nome-atual"></span>
      </section>

      <section class="cartao">
        <h2>Fila de espera</h2>
        <ul id="fila"></ul>
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
